; DCO4 Input Controller
; Match Arduino: rp2040:rp2040:rpipico:usbstack=tinyusb,opt=Fast,usbname=dco4_input
; arduino-cli: --build-property 'build.usb_manufacturer="DCO4"' --build-property 'build.usb_product="DCO4 Input"'
; CD74HC4067 + MD_REncoder_fela are #included as .cpp from the sketch (lib_ignore)

[platformio]
description = DCO4 Input Controller
src_dir = .
default_envs = input

[env:input]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = pico
board_build.core = earlephilhower
board_build.usb_stack = tinyusb
board_build.arduino.earlephilhower.usb_manufacturer = DCO4
board_build.arduino.earlephilhower.usb_product = DCO4 Input
; Arduino IDE: Tools → CPU Speed
board_build.f_cpu = 200000000L
; Arduino IDE: Tools → Optimize → Fast (-Ofast)
build_unflags = -Os
build_flags =
  -Ofast
  -DUSE_TINYUSB
lib_ldf_mode = deep+
lib_archive = no
lib_ignore =
  CD74HC4067
  MD_REncoder_fela
lib_extra_dirs =
  ${platformio.src_dir}/_build_libs
monitor_speed = 2000000
; Do not use Auto/ttyACM*: every Pico has the same VID/PID. Bind to USB product name.
custom_usb_by_id = /dev/serial/by-id/usb-*DCO4_Input*
monitor_port = /dev/serial/by-id/usb-*DCO4_Input*
upload_port = /dev/serial/by-id/usb-*DCO4_Input*
upload_protocol = picotool
extra_scripts = post:no_verify_upload.py
build_src_filter =
  +<*>
  -<_build_libs/>
  -<docs/>
