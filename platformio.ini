; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = DCO4 Input Controller
src_dir = .
default_envs = input

[env:input]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = pico
board_build.core = earlephilhower
board_build.usb_stack = tinyusb
board_build.arduino.earlephilhower.usb_manufacturer = DCO4
board_build.arduino.earlephilhower.usb_product = DCO4 Input
board_build.f_cpu = 200000000L
build_unflags = -Os
build_flags = 
	-DCMAKE_BUILD_TYPE=Release
	-O3
	-DUSE_TINYUSB
lib_ldf_mode = chain+
lib_archive = no
lib_ignore = 
	CD74HC4067
	MD_REncoder_fela
lib_extra_dirs = ${platformio.src_dir}/_build_libs
monitor_speed = 2000000
custom_usb_by_id = /dev/serial/by-id/usb-*DCO4_Input*
monitor_port = /dev/serial/by-id/usb-*DCO4_Input*
upload_port = /dev/serial/by-id/usb-*DCO4_Input*
upload_protocol = picotool
extra_scripts = post:no_verify_upload.py
build_src_filter = 
	+<*>
	-<_build_libs/>
	-<docs/>
